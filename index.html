<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qawale</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; font-family: sans-serif; }
      canvas { display: block; }

      /* Menu principal */
      #menu {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: linear-gradient(160deg, #0f0f1e 0%, #1a1a3e 100%);
        z-index: 10;
      }
      #menu h1 {
        color: #fff;
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      /* Bouton quitter (in-game) */
      #btn-quitter {
        position: fixed;
        top: 16px;
        left: 16px;
        display: none;
        z-index: 10;
      }

      /* Boutons de vue */
      #ui-views {
        position: fixed;
        top: 16px;
        right: 16px;
        display: none;
        flex-direction: row;
        gap: 8px;
        z-index: 5;
      }

      /* HUD + compteurs (en jeu) */
      #game-ui {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: none;
        flex-direction: row;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 20px 20px;
        pointer-events: none;
        z-index: 5;
      }

      #hud {
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        padding: 10px 28px;
        border-radius: 10px;
        font-size: 1rem;
        letter-spacing: 0.04em;
        backdrop-filter: blur(4px);
        text-align: center;
        margin: 0 auto;
      }

      #counters {
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-align: right;
      }

      #counter-rouge {
        color: #ff8888;
        font-size: 0.9rem;
        font-weight: 600;
      }

      #counter-bleu {
        color: #88aaff;
        font-size: 0.9rem;
        font-weight: 600;
      }

      /* Style boutons commun */
      .btn {
        padding: 12px 32px;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        border-radius: 8px;
        cursor: pointer;
        border: none;
        transition: transform 0.1s, opacity 0.1s;
      }
      .btn:hover  { opacity: 0.85; transform: scale(1.03); }
      .btn:active { transform: scale(0.97); }

      .btn-primary {
        background: #4f7fff;
        color: #fff;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(4px);
      }
    </style>
  </head>
  <body>
    <!-- Menu principal -->
    <div id="menu">
      <h1>Qawale</h1>
      <button id="btn-nouvelle-partie" class="btn btn-primary">Nouvelle partie</button>
      <a href="/rgl.pdf" target="_blank" class="btn btn-secondary">Règles</a>
    </div>

    <!-- Bouton quitter (visible en jeu) -->
    <button id="btn-quitter" class="btn btn-secondary">← Quitter</button>

    <!-- Boutons de vue (visible en jeu) -->
    <div id="ui-views"></div>

    <!-- HUD en jeu (bas de page) -->
    <div id="game-ui">
      <div style="width:100px"></div>
      <div id="hud"></div>
      <div id="counters">
        <div id="counter-rouge"></div>
        <div id="counter-bleu"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
