services:
  server:
    build: .
    command: node server.js
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=3001

  game:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - SOCKET_SERVER_URL=http://server:3001
    depends_on:
      - server
